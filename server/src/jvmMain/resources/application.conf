ktor {
  application {
    modules = [
      ru.herobrine1st.memeindex.server.module.CoreModuleKt.coreModule
      ru.herobrine1st.memeindex.server.module.WebModuleKt.webModule
    ]
  }
  deployment {
    port = 8000
    port = ${?PORT}
  }
}

public {
  baseUrl = "http://localhost:8000"
  baseUrl = ${?PUBLIC_BASE_URL}
}

database {
  url = ${?DATABASE_URL}
  username = ${?DATABASE_USERNAME}
  password = ${?DATABASE_PASSWORD}
}

media {
  path = ${?MEDIA_PATH}
}

ocr {
  baseUrl = ${?OCR_BASE_URL}
  model = "datalab-to/surya-ocr-2.5"
  model = ${?OCR_MODEL}
  apiKey = ${?OCR_API_KEY}
  prompt = "OCR this image to HTML. Each block is a div with data-label and data-bbox (x0 y0 x1 y1, normalized 0-1000)."
  prompt = ${?OCR_PROMPT}
  temperature = 0.0
  temperature = ${?OCR_TEMPERATURE}
  temperatureMax = 1.0
  temperatureMax = ${?OCR_TEMPERATURE_MAX}
  attempts = 1
  attempts = ${?OCR_ATTEMPTS}
}

embeddings {
  baseUrl = ${?EMBEDDINGS_BASE_URL}
  model = ${?EMBEDDINGS_MODEL}
  apiKey = ${?EMBEDDINGS_API_KEY}
  dimensions = ${?EMBEDDINGS_DIMENSIONS}
  batchSize = 32
  batchSize = ${?EMBEDDINGS_BATCH_SIZE}
  queryFormat = "task: search result | query: %s"
  queryFormat = ${?EMBEDDINGS_QUERY_FORMAT}
  documentFormat = "text: %s"
  documentFormat = ${?EMBEDDINGS_DOCUMENT_FORMAT}
}

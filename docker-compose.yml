services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    volumes:
      - pg:/var/lib/postgresql
  meme-index:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:test@postgres:5432/test
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: test
      MEDIA_PATH: /media
      EMBEDDINGS_BASE_URL: https://inference.api/v1
      EMBEDDINGS_MODEL: embeddinggemma2
      EMBEDDINGS_API_KEY: ...
      OCR_BASE_URL: https://inference.api/v1
      OCR_MODEL: datalab-to/surya-ocr-2
      OCR_API_KEY: ...
      PUBLIC_BASE_URL: http://localhost:8000 # this is important, URLs are generated using that
    volumes:
      - ./run/media:/media:ro
    ports:
      - 8000:8000
volumes:
  pg: {}
